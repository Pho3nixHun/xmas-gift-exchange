name: Check
on: [push, pull_request]
jobs:
    verify:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18.1-alpine
                env:
                    POSTGRES_USER: winter
                    POSTGRES_PASSWORD: test-only
                    POSTGRES_DB: winter_test
                ports: ['5432:5432']
                options: --health-cmd pg_isready --health-interval 5s --health-retries 10
        env:
            DATABASE_URL: postgresql://winter:test-only@localhost:5432/winter_test
            TEST_DATABASE_URL: postgresql://winter:test-only@localhost:5432/winter_test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run typecheck
            - run: npm run lint:ratchet
            - run: npm run format:check
            - run: npm run check:docs
            - run: npm test
            - run: npm run db:migrate
            - run: npm run test:integration
            - run: npx playwright install --with-deps chromium
            - run: E2E_URL=http://localhost:3000 npm run test:e2e
